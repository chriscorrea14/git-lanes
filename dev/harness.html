<!DOCTYPE html>
<!-- Renders the webview outside VS Code with a mocked API. Build first, dump a graph to dev/graph.json,
     then serve the repo root (e.g. `python3 -m http.server`) and open /dev/harness.html. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Git Lanes harness</title>
<script>document.write(`<link rel="stylesheet" href="../dist/webview.css?${Date.now()}">`)</script>
<style>
  :root {
    --vscode-editor-background: #1e1e1e; --vscode-editor-foreground: #d4d4d4; --vscode-descriptionForeground: #9d9d9d;
    --vscode-font-family: system-ui, sans-serif; --vscode-font-size: 13px; --vscode-editor-font-family: monospace;
    --vscode-button-secondaryBackground: #3a3d41; --vscode-button-secondaryForeground: #fff;
    --vscode-editorHoverWidget-background: #252526; --vscode-editorHoverWidget-border: #454545;
    --vscode-list-inactiveSelectionBackground: #37373d; --vscode-list-hoverBackground: #2a2d2e;
    --vscode-focusBorder: #007fd4; --vscode-editorWidget-background: #252526;
    --vscode-inputValidation-warningBackground: #352a05; --vscode-inputValidation-warningBorder: #b89500;
    --vscode-dropdown-background: #3c3c3c; --vscode-dropdown-foreground: #f0f0f0; --vscode-dropdown-border: #3c3c3c;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
  window.harnessLog = [];
  window.acquireVsCodeApi = () => ({
    postMessage(m) {
      window.harnessLog.push(m);
      console.log('[webview → host]', JSON.stringify(m));
      if (m.type === 'ready' || m.type === 'refresh') {
        fetch(`graph.json?${Date.now()}`).then((r) => r.json()).then((g) => {
          window.postMessage(g, '*');
          // Pretend the first other branch was squash-merged, to show the marker.
          const b = g.raw.branches.find((x) => x.name === 'feat/solo');
          if (b) window.postMessage({ type: 'merged', merged: { [b.name]: { tip: b.tip, how: 'squash', trunkCommit: g.raw.trunk.tip } }, chains: {} }, '*');
        });
      }
      if (m.type === 'listFiles') {
        window.postMessage({ type: 'files', shas: m.shas, left: m.shas[0], right: m.shas.at(-1), files: [
          { status: 'M', path: 'src/planner/collision.ts', stats: { added: 12, deleted: 4, modified: 3, binary: false } },
          { status: 'M', path: 'src/planner/probe.ts', stats: { added: 5, deleted: 0, modified: 1, binary: false } },
          { status: 'A', path: 'test/planner/collision.test.ts', stats: { added: 64, deleted: 0, modified: 0, binary: false } },
          { status: 'M', path: 'config/camera.yaml', stats: { added: 0, deleted: 0, modified: 2, binary: false } },
          { status: 'D', path: 'src/legacy/rpc_gate.ts', stats: { added: 0, deleted: 27, modified: 0, binary: false } },
          { status: 'R', oldPath: 'src/planner/oneshot.ts', path: 'src/one_shot.ts', stats: { added: 0, deleted: 0, modified: 8, binary: false } },
          { status: 'M', path: 'package.json', stats: { added: 15, deleted: 0, modified: 0, binary: false } },
          { status: 'M', path: 'assets/logo.png', stats: { added: 0, deleted: 0, modified: 0, binary: true } },
        ] }, '*');
      }
    },
  });
</script>
<script>document.write(`<script src="../dist/webview.js?${Date.now()}"><\/script>`)</script>
</body>
</html>
